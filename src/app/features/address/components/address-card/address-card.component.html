<div class="address-card">

    <div class="address-main">
        <h3>
            {{ address.street }}, {{ address.number }}
        </h3>

        @if (address.complement) {
            <p>{{ address.complement }}</p>
        }

        <p>{{ address.district }}</p>

        <p>
            {{ address.city }} - {{ address.state }}
        </p>

        <p>{{ address.zipCode }}</p>

        <p class="country">
            {{ address.country }}
        </p>
    </div>

    <div class="actions">
        <p-button label="Edit"/>
        <p-button label="Delete" severity="danger"/>
    </div>

</div>
