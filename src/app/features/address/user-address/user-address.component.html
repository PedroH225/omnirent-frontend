<div class="address-header">

    <div>
        <h2>
            My Addresses
        </h2>

        <p>
            Manage your saved addresses
        </p>
    </div>

    <p-button
        label="Add Address"
        icon="pi pi-plus">
    </p-button>

</div>

<p-confirmdialog></p-confirmdialog>

<div class="addresses-grid">

    <app-address-card
        *ngFor="let address of addresses"
        [address]="address"
        (delete)="deleteAddress($event)">
    </app-address-card>


</div>
