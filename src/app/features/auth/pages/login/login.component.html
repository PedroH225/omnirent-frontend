<div class="login-container">
    <p-card>
        <div class="logo-container">
            <img src="assets/omni-logo.png" alt="OmniRent" class="logo" />
        </div>
        <form (ngSubmit)="login()">
            <div class="login-card">
                <h2 class="login-title">Sign in</h2>
                <p-floatlabel>
                    <input name="email" id="email" type="text" pInputText [(ngModel)]="email" />
                    <label for="email">Email</label>
                </p-floatlabel>

                <p-floatlabel>
                    <p-password name="pasword" id="password" [feedback]="false" [(ngModel)]="password"
                        [toggleMask]="true">
                    </p-password>
                    <label for="password">Password</label>
                </p-floatlabel>

                @if (errorMessage) {
                <p-message severity="error" [text]="errorMessage"></p-message>
                }

                <div class="button-container">
                    <p-button type="submit" label="Submit" />
                </div>
                <div class="social-login">
                    <button type="button" class="social-button">
                        <i class="pi pi-github"></i>
                    </button>

                    <button type="button" class="social-button">
                        <i class="pi pi-google"></i>
                    </button>
                </div>
            </div>
        </form>
    </p-card>
    <a routerLink="/register" class="register-link">
        Don't have an account? Sign up
    </a>
</div>
