<app-catalog-bar></app-catalog-bar>

<div class="hero-gallery">
    <p-galleria [value]="images" [showThumbnails]="false" [showIndicators]="true" [showIndicatorsOnItem]="true"
        [circular]="true" [autoPlay]="true">

        <ng-template #item let-item>
            <img [src]="item.itemImageSrc" class="hero-image" />
        </ng-template>

    </p-galleria>
</div>

<section class="category-section">

    <div class="section-header">
        <div>
            <h2>Capture every moment</h2>
            <p>Professional cameras, lighting and audio equipment.</p>
        </div>
        <a (click)="viewAll('AUDIOVISUAL')">View all</a>
    </div>

    <p-carousel [value]="audiovisualCards" [numVisible]="5" [numScroll]="1" [responsiveOptions]="responsiveOptions">

        <ng-template #item let-item>
            <div class="card-wrapper">
                <app-item-feed-card [item]="item">
                </app-item-feed-card>
            </div>
        </ng-template>

    </p-carousel>

</section>
