<div class="images-section">
  <div class="images-header">
    <div>
      <h3>{{ "item.form.images.title" | translate }}</h3>

      <small>
        {{ "item.form.images.description" | translate }}
      </small>
    </div>

    <p-button
      icon="pi pi-plus"
      [label]="'item.form.images.actions.addImages' | translate"
      [disabled]="images.length >= 5"
      (onClick)="fileInput.click()"
    />

    <input
      #fileInput
      type="file"
      hidden
      multiple
      accept="image/*"
      (change)="onFilesSelected($event)"
    />
  </div>

  <div class="images-grid">
    <div class="image-card" *ngFor="let image of images; let i = index">
      <div class="preview">
        <img
          [src]="image.previewUrl"
          [alt]="'item.form.images.preview' | translate"
        />

        @if (i === 0) {
          <div class="badge">
            {{ "item.form.images.main" | translate }}
          </div>
        }
      </div>

      <div class="image-footer">
        <span> #{{ i + 1 }} </span>

        <div class="actions">
          <p-button
            icon="pi pi-arrow-left"
            [text]="true"
            [disabled]="i === 0"
            [ariaLabel]="'item.form.images.actions.moveLeft' | translate"
            (onClick)="moveLeft(i)"
          />

          <p-button
            icon="pi pi-arrow-right"
            [text]="true"
            [disabled]="i === images.length - 1"
            [ariaLabel]="'item.form.images.actions.moveRight' | translate"
            (onClick)="moveRight(i)"
          />

          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [ariaLabel]="'item.form.images.actions.remove' | translate"
            (onClick)="removeImage(i)"
          />
        </div>
      </div>

      @if (getError(i)) {
        <div class="image-error">
          <app-field-error [message]="getError(i)" />
        </div>
      }
    </div>

    @if (images.length < 5) {
      <button type="button" class="add-card" (click)="fileInput.click()">
        <i class="pi pi-plus"></i>

        <span>
          {{ "item.form.images.actions.addImage" | translate }}
        </span>
      </button>
    }
  </div>

  @if (getCollectionError()) {
    <div class="collection-error">
      <app-field-error [message]="getCollectionError()" />
    </div>
  }

  <small class="hint">
    {{ "item.form.images.hint" | translate }}
  </small>
</div>
