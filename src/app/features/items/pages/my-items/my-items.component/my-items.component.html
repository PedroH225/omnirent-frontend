<p-dataview [value]="items" [layout]="layout">

    <ng-template #header>
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-semibold">
                My Listings
            </h2>

            <p-selectbutton [(ngModel)]="layout" [options]="options" optionValue="value">
                <ng-template #item let-item>
                    <i class="pi" [ngClass]="{
                            'pi-th-large': item.value === 'grid',
                            'pi-list': item.value === 'list'
                        }">
                    </i>
                </ng-template>
            </p-selectbutton>
        </div>
    </ng-template>


    <ng-template #grid let-items>
        <div class="items-grid">

            <div *ngFor="let item of items">

                <div class="item-card">

                    <div class="image-container">

                        <img [src]="item.thumbnailKey || 'assets/placeholder-img.png'" [alt]="item.name" />

                    </div>


                    <div class="content">

                        <span class="category">
                            {{ item.subCategoryName }}
                        </span>

                        <h3>
                            {{ item.name }}
                        </h3>


                        <div class="details">

                            <span>
                                {{ item.itemConditionLabel }}
                            </span>

                            <span class="status" [class.available]="item.itemStatus === 'AVAILABLE'">

                                {{ item.itemStatusLabel }}

                            </span>

                        </div>


                        <div class="footer">

                            <span class="price">
                                ${{ item.basePrice }}/day
                            </span>


                            <div class="actions">

                                <p-button icon="pi pi-pencil" [text]="true">
                                </p-button>

                                <p-button icon="pi pi-trash" severity="danger" [text]="true">
                                </p-button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </ng-template>


    <ng-template #list let-items>

        <div *ngFor="let item of items" class="list-item">

            <img class="list-image" [src]="item.thumbnailKey || 'assets/placeholder-img.png'" [alt]="item.name">

            <div class="list-content">

                <span class="category">
                    {{ item.subCategoryName }}
                </span>

                <h3>{{ item.name }}</h3>

                <div class="details">
                    <span>{{ item.itemConditionLabel }}</span>
                    <span class="status" [class.available]="item.itemStatus === 'AVAILABLE'">
                        {{ item.itemStatusLabel }}
                    </span>
                </div>

            </div>

            <div class="list-actions">

                <span class="price">
                    ${{ item.basePrice }}/day
                </span>

                <div class="actions">
                    <p-button icon="pi pi-pencil" [text]="true">
                    </p-button>

                    <p-button icon="pi pi-trash" severity="danger" [text]="true">
                    </p-button>
                </div>

            </div>

        </div>

    </ng-template>

</p-dataview>
