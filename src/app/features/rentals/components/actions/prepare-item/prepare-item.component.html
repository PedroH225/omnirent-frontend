<div class="prepare-action">

    @if (isOwner) {
        <p-button
            [label]="'rental.actions.prepare_item.button' | translate"
            icon="pi pi-box"
            severity="primary"
            (onClick)="startPreparing()"
        />
    } @else {
        <div class="preparation-status">
            <i class="pi pi-clock"></i>

            <div class="preparation-status-content">
                <strong>
                    {{ 'rental.actions.prepare_item.status.title' | translate }}
                </strong>

                <span>
                    {{ 'rental.actions.prepare_item.status.message' | translate }}
                </span>
            </div>
        </div>
    }

</div>

<p-confirmdialog></p-confirmdialog>
