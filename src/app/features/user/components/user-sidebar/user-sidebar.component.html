<div class="sidebar-trigger">
  <p-button
    icon="pi pi-bars"
    [text]="true"
    [rounded]="true"
    (onClick)="drawerVisible = true"
  />
</div>

<p-drawer
  [(visible)]="drawerVisible"
  position="left"
  [style]="{ width: '280px' }"
  styleClass="user-sidebar-drawer"
>
  <p-panelmenu [model]="items" [multiple]="true" />
</p-drawer>
