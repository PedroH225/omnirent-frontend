<div class="item-card">
  <div class="image-container">
    <img
      [src]="item.imageUrl || 'assets/placeholder-img.png'"
      [alt]="item.name"
      (error)="item.imageUrl = 'assets/placeholder-img.png'"
    />
  </div>

  <div class="content">
    <span class="category">
      {{ item.categoryLabel }}
    </span>

    <h3>
      {{ item.name }}
    </h3>
    <span>
      {{ "enums.itemCondition." + item.condition.toLowerCase() | translate }}
    </span>

    <div class="footer">
      <strong>
        {{ item.price.dailyPrice | currency: "BRL" : "symbol" : "1.2-2" }}/{{
          "item.day" | translate
        }}
      </strong>

      <p-button
        [label]="'common.view' | translate"
        size="small"
        (onClick)="onView()"
      />
    </div>
  </div>
</div>
